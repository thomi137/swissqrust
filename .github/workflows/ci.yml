name: CI

on:
  push:
    branches: [ dev, test, master ]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ----------------------------
      # Install tools
      # ----------------------------

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      # ----------------------------
      # Run tests under coverage instrumentation (one pass gives us both
      # the JUnit report and the LCOV coverage data - the nextest `ci`
      # profile's junit output, from .config/nextest.toml, applies
      # regardless of the coverage instrumentation).
      # ----------------------------

      - name: Run tests with nextest
        run: |
          cargo llvm-cov nextest \
            --package swiss_qrust \
            --all-features \
            --profile ci \
            --lcov --output-path lcov.info

      - name: Upload test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Rust Tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit

      # ----------------------------
      # Upload coverage to Codecov
      # ----------------------------

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          # Codecov requires a token even for public repos; add one at
          # https://codecov.io (sign in with GitHub, no install needed)
          # and store it as the CODECOV_TOKEN repo secret.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
