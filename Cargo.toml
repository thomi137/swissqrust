[workspace]
members = ["cli", "gui", "web"]

[package]
name = "swiss_qrust"
version = "0.2.0"
edition = "2024"
description = "Generate Swiss QR-bill (QR-Rechnung / QR-facture / QR-fattura) payment slips as PDF or SVG, per the Swiss Payment Standards implementation guidelines."
license = "MIT"
repository = "https://github.com/thomi137/swissqrust"
readme = "README.md"
keywords = ["qr-bill", "swiss", "invoice", "pdf", "qrcode"]
categories = ["finance", "rendering", "encoding"]

[lib]
name = "swiss_qrust"
path = "src/lib.rs"

[features]
pdf-debug = []

[dependencies]
serde =  { version = "1.0.228", features = ["derive"]}
regex = "1.12.2"
once_cell = "1.21.3"
thiserror = "2.0.18"
qrcodegen = "1.8.0"
usvg = "0.47.0"
resvg = "0.47.0"
svg = "0.18.0"
pdf-writer = "0.15.0"
ttf-parser = "0.25.1"
miniz_oxide = "0.9.0"
anyhow = "1.0.102"
toml = "1.0.3"
serde_json = "1.0.149"
base64 = "0.23.0"
strum = {  version = "0.28.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
serde =  { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
roxmltree = "0.21.1"

[dev-dependencies]
pdf-extract = "0.12.0"
